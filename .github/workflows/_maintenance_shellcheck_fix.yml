# Temporary one-shot maintenance automation for PR #7.
name: Maintenance - ShellCheck fix

on:
  push:
    branches: ["fix/stabilization-1.3.1"]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'fix: resolve NETWATCH CI and ShellCheck failures'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Apply exact ShellCheck fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              "netwatch.sh": [
                  (
                      'REPOSITORY_URL="https://github.com/sudomarc/NETWATCH"\n',
                      '',
                  ),
                  (
                      '    "$hook_added" && iptables -D FORWARD -j NETWATCH_BLOCK >/dev/null 2>&1 || true\n',
                      '    if "$hook_added"; then\n'
                      '        iptables -D FORWARD -j NETWATCH_BLOCK >/dev/null 2>&1 || true\n'
                      '    fi\n',
                  ),
                  (
                      '    [[ -n "$mac" && "$mac" != -- ]] && iptables -D NETWATCH_BLOCK -m mac --mac-source "$mac" -j DROP >/dev/null 2>&1 || true\n',
                      '    if [[ -n "$mac" && "$mac" != -- ]]; then\n'
                      '        iptables -D NETWATCH_BLOCK -m mac --mac-source "$mac" -j DROP >/dev/null 2>&1 || true\n'
                      '    fi\n',
                  ),
                  (
                      '        [[ "$cmdline" == *arpspoof* && "$cmdline" == *"-i $IFACE"* &&\n'
                      '           "$cmdline" == *"-t $first_target"* && "$cmdline" == *"$second_target"* ]] &&\n'
                      '            kill "$pid" 2>/dev/null || true\n',
                      '        if [[ "$cmdline" == *arpspoof* && "$cmdline" == *"-i $IFACE"* &&\n'
                      '              "$cmdline" == *"-t $first_target"* && "$cmdline" == *"$second_target"* ]]; then\n'
                      '            kill "$pid" 2>/dev/null || true\n'
                      '        fi\n',
                  ),
                  (
                      '    local outfile="$CONFIG_DIR/export_$(date \'+%Y%m%d_%H%M%S\').$fmt"\n',
                      '    local outfile\n'
                      '    outfile="$CONFIG_DIR/export_$(date \'+%Y%m%d_%H%M%S\').$fmt"\n',
                  ),
              ],
              "netwatch-ipv6.sh": [
                  (
                      '    [[ -n "$GATEWAY_IPV6" ]] && GATEWAY_IPV6=$(normalize_ipv6 "$GATEWAY_IPV6") || true\n',
                      '    if [[ -n "$GATEWAY_IPV6" ]]; then\n'
                      '        GATEWAY_IPV6=$(normalize_ipv6 "$GATEWAY_IPV6") || true\n'
                      '    fi\n',
                  ),
                  (
                      '    "$hook_added" && ip6tables -D FORWARD -j NETWATCH6_BLOCK >/dev/null 2>&1 || true\n',
                      '    if "$hook_added"; then\n'
                      '        ip6tables -D FORWARD -j NETWATCH6_BLOCK >/dev/null 2>&1 || true\n'
                      '    fi\n',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text()
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {name}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY

      - name: Validate patch
        run: |
          bash -n netwatch.sh netwatch-ipv6.sh netwatch-router.sh
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck netwatch.sh netwatch-ipv6.sh netwatch-router.sh
          git diff --check

      - name: Commit and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add netwatch.sh netwatch-ipv6.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          GIT_AUTHOR_NAME='github-actions[bot]' \
          GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          GIT_COMMITTER_NAME='github-actions[bot]' \
          GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com' \
          git commit -m 'fix: resolve NETWATCH CI and ShellCheck failures'
          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          git -c "http.extraheader=AUTHORIZATION: basic $AUTH" \
            push origin "HEAD:${GITHUB_REF_NAME}"
